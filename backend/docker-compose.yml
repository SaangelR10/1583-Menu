services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe1583
      POSTGRES_PASSWORD: cafe1583
      POSTGRES_DB: cafe1583
    ports:
      - "5432:5432"
    volumes:
      - cafe1583_pgdata:/var/lib/postgresql/data

volumes:
  cafe1583_pgdata:
